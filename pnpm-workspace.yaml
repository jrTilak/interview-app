packages:
  - "apps/*"
  - "packages/*"

overrides:
  "esbuild@<=0.24.2": "0.25.12"
  "js-yaml@>=5.0.0 <=5.2.1": "5.2.2"

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": false
  "esbuild": true
  "protobufjs": true
  "unrs-resolver": true

minimumReleaseAgeExclude:
  - "@tanstack/form-core@1.33.3"
  - "@tanstack/react-form@1.33.3"
