name: interview-desk

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_desk}
      POSTGRES_USER: ${POSTGRES_USER:-interview_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_desk}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - interview-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/nestjs-server/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-host}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      local-llm:
        condition: service_healthy
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: ${APP_NAME:-Interview Desk}
      API_PREFIX: api
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-18080},http://127.0.0.1:${FRONTEND_PORT:-18080}}
      API_DOCS_FILE_PATH: docs/api-info.md
      SWAGGER_ENABLE: ${SWAGGER_ENABLE:-true}
      DEV_TOOLS_ENABLED: ${DEV_TOOLS_ENABLED:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-docker-local-secret-change-before-public-deployment}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${FRONTEND_PORT:-18080}}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-interview_desk}
      DB_USERNAME: ${POSTGRES_USER:-interview_desk}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-interview_desk}
      DB_CONNECT_TIMEOUT_MS: 10000
      DB_AUTO_MIGRATE: "true"
      PGSSLMODE: disable
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://local-llm:8003}
      LOCAL_LLM_TIMEOUT_MS: ${LOCAL_LLM_TIMEOUT_MS:-120000}
      LOCAL_STT_URL: ${LOCAL_STT_URL:-http://stt:8002}
      LOCAL_STT_TIMEOUT_MS: ${LOCAL_STT_TIMEOUT_MS:-45000}
      LOCAL_TTS_URL: ${LOCAL_TTS_URL:-http://tts:8001}
      LOCAL_TTS_VOICE: ${LOCAL_TTS_VOICE:-professional-default}
      LOCAL_TTS_TIMEOUT_MS: ${LOCAL_TTS_TIMEOUT_MS:-45000}
      AUDIO_SILENCE_MS: ${AUDIO_SILENCE_MS:-1800}
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-10485760}
      MEDIA_MAX_CHUNK_BYTES: ${MEDIA_MAX_CHUNK_BYTES:-524288}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18081}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.15}
    restart: unless-stopped
    init: true
    volumes:
      - interview-ollama-data:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 15s

  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.15}
    init: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_MODEL:-qwen3:4b}"]
    restart: "no"

  local-llm:
    build:
      context: ./apps/local-llm-service
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-host}
    restart: unless-stopped
    init: true
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-110}
      OLLAMA_HEALTH_TIMEOUT_SECONDS: ${OLLAMA_HEALTH_TIMEOUT_SECONDS:-3}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    ports:
      - "127.0.0.1:${LLM_PORT:-18084}:8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      # A worst-case provider timeout is 110 seconds. Keep startup checks in
      # their grace period long enough for that attempt to finish and retry.
      start_period: 120s
    stop_grace_period: 15s

  stt:
    build:
      context: ./apps/stt
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-host}
    restart: unless-stopped
    init: true
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      STT_MAX_AUDIO_BYTES: ${STT_MAX_AUDIO_BYTES:-10485760}
      STT_MAX_AUDIO_SECONDS: ${STT_MAX_AUDIO_SECONDS:-180}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-45}
    ports:
      - "127.0.0.1:${STT_PORT:-18083}:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 10s

  tts:
    build:
      context: ./apps/tts
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-host}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${TTS_PORT:-18082}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    stop_grace_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/react-client/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-host}
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

volumes:
  interview-postgres-data:
  interview-ollama-data:
