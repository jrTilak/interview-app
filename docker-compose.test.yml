name: interview-desk-test

services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: interview_desk_test
      POSTGRES_USER: interview_desk
      POSTGRES_PASSWORD: interview_desk
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_desk -d interview_desk_test"]
      interval: 1s
      timeout: 3s
      retries: 30
